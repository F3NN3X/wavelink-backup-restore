# Publishes the artifacts the in-app updater downloads.
#
# One release, two archives:
#   WaveLinkBackup-X.Y.Z-app-win-x64.zip    the app (framework-dependent)
#   WaveLinkBackup-CLI-X.Y.Z-win-x64.zip    the CLI, single file
#
# The updater looks for `*app-win-x64.zip` and a `.sha256` beside it. A checksum is not optional —
# UpdateDownloader REFUSES an update that has no published checksum rather than installing whatever
# arrived (see its own comment on what that does and does not prove).
#
# Both publishes are framework-dependent: the .NET 10 runtime is a prerequisite, not a payload.
# A machine without it gets the standard .NET "framework not found" dialog pointing at the install
# page — there is no in-app probe to add, because managed code does not run before that check.
#
# The flags here match each csproj rather than overriding it: technical-debt.md §1.5 is about
# upstream's pipeline disagreeing with its project file; ours agrees on purpose, and a local
# `dotnet publish` produces the same artifact this does.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # ci-green reads the Actions API (workflow runs) to wait for a green CI on this commit; that is
  # an actions-scope read, not covered by contents.
  actions: read

jobs:
  # CI is the gate: nothing publishes until the full suite is green on this exact commit. Polls
  # the Actions API for a completed run of ci.yml on the same ref (tag push or an earlier push to
  # main both qualify) and fails if that run finished red, so publish never starts on a broken
  # build. github-script is first-party - no third action to pin or trust.
  ci-green:
    runs-on: windows-latest
    steps:
      - uses: actions/github-script@v7
        # github-script does not export its github-token input to process.env; expose it here so
        # the REST fetch below can authenticate. Same ephemeral token the action already holds.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          debug: true
          retries: 3
          script: |
            // REST via fetch, not github.rest: the Octokit helper routes listWorkflowRuns through
            // GraphQL, which GITHUB_TOKEN cannot reach on this account ("Resource not accessible
            // by integration"). Plain REST is what the token is scoped for.
            const ref = "${{ github.ref_name }}";
            // apiUrl, not serverUrl: the REST API lives at api.github.com; serverUrl is the web
            // host (github.com), which has no /actions routes and 404s.
            const url = `${context.apiUrl}/repos/${context.repo.owner}/${context.repo.repo}/actions/workflows/ci.yml/runs?branch=${encodeURIComponent(ref)}&event=push&per_page=10`;
            const deadline = Date.now() + 40 * 60 * 1000; // CI takes a few minutes; bound the wait
            for (;;) {
              const res = await fetch(url, {
                headers: {
                  authorization: `bearer ${process.env.GITHUB_TOKEN}`,
                  accept: "application/vnd.github+json",
                },
              });
              if (!res.ok) throw new Error(`CI-status lookup failed: HTTP ${res.status}`);
              const runs = (await res.json()).workflow_runs ?? [];
              const done = runs.find(
                (r) => r.status === "completed" && r.head_branch === ref);
              if (done) {
                if (done.conclusion === "success") {
                  core.info(`CI green on ${ref} (${done.html_url})`);
                  return;
                }
                throw new Error(`CI finished ${done.conclusion} on ${ref}: ${done.html_url}`);
              }
              if (Date.now() > deadline)
                throw new Error(`Timed out waiting for a completed ci.yml run on ${ref}`);
              core.info("Waiting for CI to finish...");
              await new Promise((r) => setTimeout(r, 60 * 1000));
            }

  publish:
    needs: ci-green
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The version comes from the tag, so the running build can compare itself against a release
      # tag without anybody remembering to edit Directory.Build.props first. ReleaseVersion.Parse
      # reads `v1.4.0`; this strips the `v` for the assembly. A manual run has no tag — ref_name
      # is the branch name, which is not a version — so fall back to Directory.Build.props and
      # fail loudly if neither yields a usable version. Publishing with `-p:Version=main` (the
      # old behaviour) made NuGet restore die with MSB4181 before a single project compiled.
      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v\d') {
            $version = $tag -replace '^v', ''
          } else {
            $props = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
            if (-not $props) { throw "No version tag and no <Version> in Directory.Build.props" }
            $version = $props
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release --nologo

      # Framework-dependent: no --self-contained flag, so the csproj default (false) applies.
      # The app's InvariantGlobalization drops the satellite locale folders; what remains is the
      # app assemblies plus a small apphost — a few MB, not the runtime.
      - name: Publish the app
        run: >
          dotnet publish src/WaveLinkBackup.App/WaveLinkBackup.App.csproj
          --configuration Release
          --runtime win-x64
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/app

      # The CLI is its own artifact, published beside the app's output directory only to keep the
      # two publish steps symmetric. It is single-file and framework-dependent: one exe of a few
      # MB that resolves the .NET 10 runtime from the machine at startup.
      - name: Publish the CLI
        run: >
          dotnet publish src/WaveLinkBackup.Cli/WaveLinkBackup.Cli.csproj
          --configuration Release
          --runtime win-x64
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/cli

      # The archive's ROOT is the install directory's contents, not a folder containing them:
      # UpdateInstaller expands the app archive and expects to find WaveLinkBackup.exe at the top
      # level, and refuses the update if it does not. The CLI archive has no such contract — it is
      # downloaded by hand or by a script, not by the updater.
      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $app = "WaveLinkBackup-$v-app-win-x64.zip"
          $cli = "WaveLinkBackup-CLI-$v-win-x64.zip"
          Compress-Archive -Path publish/app/* -DestinationPath $app
          Compress-Archive -Path publish/cli/* -DestinationPath $cli
          foreach ($name in @($app, $cli)) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding ascii -NoNewline
          }
          "app=$app" >> $env:GITHUB_OUTPUT
          "cli=$cli" >> $env:GITHUB_OUTPUT

      # The release body carries the asset links and checksums so a human who lands on the
      # GitHub Release page can verify by hand what the updater verifies automatically. The
      # updater only reads the .sha256 beside *app-win-x64.zip; this is for people, not code.
      # Written to a file because a markdown body does not survive being inlined into a
      # workflow with: input cleanly. No backticks anywhere in this script: the runner wraps
      # inline run: blocks in a way that mangles them ("string missing the terminator"), so
      # the code-fence marker is built from [char]96 instead of a literal.
      - name: Build release body
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $app = "${{ steps.package.outputs.app }}"
          $cli = "${{ steps.package.outputs.cli }}"
          $appHash = (Get-Content "$app.sha256" -Raw).Trim()
          $cliHash = (Get-Content "$cli.sha256" -Raw).Trim()
          $base = "${{ github.server_url }}/${{ github.repository }}/releases/download/v$v"
          $tick = [char]96
          $tripleTick = "$tick$tick$tick"
          $fence = "$tripleTick powershell"

          # The version's notes, pulled from CHANGELOG.md so the release page says what changed
          # rather than only where to download. The section runs from "## [v] - date" to the next
          # blank-line-then-"---" separator (or EOF). Keep a Changelog headings and links; drop
          # the "## [v]" line itself (the page already carries the version) and the leading
          # summary paragraph's trailing blank. If the file or section is missing, fall back to a
          # single honest line rather than an empty heading - a release that names its version but
          # says nothing about it is worse than one that points at the changelog.
          $notes = @()
          if (Test-Path CHANGELOG.md) {
            $text = Get-Content CHANGELOG.md -Raw
            # Escape the version before it enters the pattern: a version string is data, not regex.
            $pattern = "(?ms)^## \[" + [regex]::Escape($v) + "\][^\r\n]*\r?\n(.*?)(?=^---\s*$|\Z)"
            $match = [regex]::Match($text, $pattern)
            if ($match.Success) {
              $body = $match.Groups[1].Value
              # Trim the trailing separator and surrounding blank lines.
              $body = $body -replace "(?ms)\s*---\s*$", ""
              $body = $body.Trim()
              if (-not [string]::IsNullOrWhiteSpace($body)) { $notes = @("## What's new", "", $body, "") }
            }
          }
          if ($notes.Count -eq 0) {
            $notes = @("## What's new", "", "See the [changelog](CHANGELOG.md) for this version.", "")
          }

          $lines = @(
            "Wave Link Backup v$v for Windows x64.",
            ""
          ) + $notes + @(
            "## Downloads",
            "",
            "| File | SHA-256 |",
            "|---|---|",
            "| [$app]($base/$app) | $($tick + $appHash + $tick) |",
            "| [$cli]($base/$cli) | $($tick + $cliHash + $tick) |",
            "",
            "## Prerequisite",
            "",
            "Both archives are framework-dependent: the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)",
            "must be installed before either will run. A machine without it gets the standard .NET",
            '"framework not found" dialog pointing at that page.',
            "",
            "## Verifying a download",
            "",
            $fence,
            "(Get-FileHash $app -Algorithm SHA256).Hash.ToLower()",
            "# should equal: $appHash",
            $tripleTick
          )
          $lines | Out-File -FilePath release_body.md -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            ${{ steps.package.outputs.app }}
            ${{ steps.package.outputs.app }}.sha256
            ${{ steps.package.outputs.cli }}
            ${{ steps.package.outputs.cli }}.sha256
